name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aip
          POSTGRES_PASSWORD: aip
          POSTGRES_DB: aip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aip" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit, integration and agent tests (no network, scripted model)
        run: pytest --cov=aip --cov-report=term-missing
      - name: Migrations against Postgres
        env:
          AIP_DATABASE_URL: postgresql+asyncpg://aip:aip@localhost:5432/aip
        run: alembic upgrade head
      - name: Seed against Postgres (schema from migrations + data smoke test)
        env:
          AIP_DATABASE_URL: postgresql+asyncpg://aip:aip@localhost:5432/aip
          AIP_AUTO_CREATE_SCHEMA: "false"
        run: python -m aip.seed --load --out /tmp/mock --golden /tmp/golden
      - name: Offline pipeline against Postgres
        env:
          AIP_DATABASE_URL: postgresql+asyncpg://aip:aip@localhost:5432/aip
        run: python -m aip.agents process --all --offline
      - name: Eval harness smoke (baseline, no gate)
        run: python -m aip.evals extraction --extractor baseline

  # Evals with the real model: only when prompts, agents or the golden set change, and only
  # when the repository has an API key configured. Costs tokens.
  evals:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
             | grep -qE '^src/aip/(agents|llm|seed/documents)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.changed.outputs.run == 'true'
        run: pip install -e ".[dev]"
      - name: Extraction eval with gates
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        run: python -m aip.evals extraction --extractor llm --gate
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.run == 'true'
        with:
          name: eval-reports
          path: evals/reports/

  web:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Python env for the demo core API used by E2E
        working-directory: .
        run: python -m venv .venv && .venv/bin/pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (handler and customer journeys)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e/screenshots/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aip-core:${{ github.sha }} .
